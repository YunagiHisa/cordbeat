name: timer
description: "Set a reminder or timer"
description_en: "Set a reminder or timer"
version: "1.0.0"
author: "cordbeat"

usage: |
  Use this skill when a reminder is needed after a specified number of minutes.
  HEARTBEAT checks the reminder time and notifies the target user.

parameters:
  - name: user_id
    type: string
    required: true
    description: "User ID to remind"
  - name: message
    type: string
    required: true
    description: "Reminder message"
  - name: minutes
    type: integer
    required: false
    description: "Minutes until the reminder (default: 30)"

contexts:
  shared_voice: false

safety:
  level: safe
  sandbox: true
  network: false
  filesystem: false
