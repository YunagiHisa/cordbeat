name: api_call
description: "Send HTTP requests to an external API"
description_en: "Send HTTP requests to an external API"
version: "1.0.0"
author: "cordbeat"

usage: |
  Use this skill to call an external REST API.
  Supports GET and POST methods.
  Requires user approval.

parameters:
  - name: url
    type: string
    required: true
    description: "Request URL"
  - name: method
    type: string
    required: false
    description: "HTTP method: GET / POST (default: GET)"
  - name: headers
    type: object
    required: false
    description: "Additional HTTP headers as an object"
  - name: body
    type: object
    required: false
    description: "Request body as JSON for POST requests"
  - name: timeout
    type: integer
    required: false
    description: "Timeout in seconds (default: 15)"

contexts:
  shared_voice: false

safety:
  level: requires_confirmation
  sandbox: false
  network: true
  filesystem: false
