name: fetch_url
description: "Fetch a URL and return readable text plus a small list of page-image candidates"
description_en: "Fetch a URL and return readable text plus a small list of page-image candidates."
version: "1.1.0"
author: "cordbeat"

usage: |
  Use this skill to open an allowed URL supplied by the user or returned by a tool.
  HTML tags are removed and only readable body text is returned.
  Do not use it for search queries.

parameters:
  - name: url
    type: string
    required: true
    description: "Full URL of the page to fetch (http:// or https://)"
  - name: max_length
    type: integer
    required: false
    description: "Maximum number of body-text characters to return (default: 8000)"

contexts:
  shared_voice: true

safety:
  level: safe
  sandbox: false
  network: true
  filesystem: false
