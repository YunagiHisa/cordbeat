name: read_diary
description: "Read diary or log entries and return past records"
description_en: "Read diary/logs and return past records"
version: "1.0.0"
author: "cordbeat"

usage: |
  Use this skill to review past diary entries or logs.
  It is useful for reviewing previous conversations with a user.

parameters:
  - name: user_id
    type: string
    required: true
    description: "User ID whose records should be retrieved"
  - name: record_type
    type: string
    required: false
    description: "Record type to retrieve (diary / proposal / recall_hint)"
  - name: limit
    type: integer
    required: false
    description: "Maximum number of records to retrieve"

contexts:
  shared_voice: false

safety:
  level: safe
  sandbox: true
  network: false
  filesystem: false
