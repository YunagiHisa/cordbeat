name: draw
description: "Draw images using a line-based DSL for shapes, text, turtle graphics, and more"
description_en: "Draw images using a rich line-based DSL (circles, rects, text, turtle graphics, bezier, gradients, etc.)"
version: "1.2.0"
author: "cordbeat"

usage: |
  Generate an image using text-based DSL commands.
  SIZE, CANVAS, CIRCLE, RECT, ELLIPSE, LINE, POLYGON, TEXT,
  ARC, BEZIER, GRADIENT, DOTS, STAR, SPIRAL,
  TURTLE, HEADING, PENCOLOR, PENWIDTH, PENUP, PENDOWN,
  FORWARD, BACKWARD, RIGHT, LEFT, REPEAT ... END,
  SAVE and OUTPUT commands are also available.
  OUTPUT returns a base64-encoded image.
  HSL colors are supported in hsl(h,s%,l%) format.
  REPEAT n ... END repeats a block up to 1000 times with up to 10 nesting levels.

parameters:
  - name: commands
    type: string
    required: true
    description: "Newline-separated DSL command string"

contexts:
  shared_voice: false

safety:
  level: requires_confirmation
  sandbox: true
  network: false
  filesystem: true

rate_limit:
  per_minute: 10
