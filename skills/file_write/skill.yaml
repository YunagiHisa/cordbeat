name: file_write
description: "Write to a file at the specified path"
description_en: "Write to a file at the specified path"
version: "1.0.0"
author: "cordbeat"

usage: |
  Use this skill to create, overwrite, or append to a local text file.
  Writing the approved path requires user confirmation before execution.

parameters:
  - name: path
    type: string
    required: true
    description: "Destination file path"
  - name: content
    type: string
    required: true
    description: "Content to write"
  - name: mode
    type: string
    required: false
    description: "Write mode: write (overwrite) / append (default: write)"

contexts:
  shared_voice: false

safety:
  level: requires_confirmation
  sandbox: true
  network: false
  filesystem: true
