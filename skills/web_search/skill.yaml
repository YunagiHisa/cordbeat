name: web_search
description: "Search the web by keyword and return related page titles, URLs, and snippets"
description_en: "Search the web by keyword and return a list of related pages (title/URL/snippet)."
version: "1.0.1"
author: "cordbeat"

usage: |
  Use this skill to search the web by keyword.
  It is useful for checking current information, news, and general knowledge.
  Pass search keywords to query; passing a URL may return no results.

parameters:
  - name: query
    type: string
    required: true
    description: "Natural-language search keywords, not a URL"
  - name: max_results
    type: integer
    required: false
    description: "Maximum number of results to retrieve (default: 5)"

contexts:
  shared_voice: true

safety:
  level: requires_confirmation
  sandbox: true
  network: true
  filesystem: false
