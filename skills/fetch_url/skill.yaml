name: fetch_url
description: "Fetch a URL and return readable text for viewing or summarizing articles"
description_en: "Fetch a URL and return its readable text content (for reading or summarizing articles)"
version: "1.0.0"
author: "cordbeat"

usage: |
  Use this skill to open a URL supplied by the user or returned by web_search.
  HTML tags are removed and only readable body text is returned.
  Do not use it for search queries; use web_search instead.

parameters:
  - name: url
    type: string
    required: true
    description: "Full URL of the page to fetch (http:// or https://)"
  - name: max_length
    type: integer
    required: false
    description: "Maximum number of body-text characters to return (default: 8000)"

contexts:
  shared_voice: true

safety:
  level: safe
  sandbox: false
  network: true
  filesystem: false
