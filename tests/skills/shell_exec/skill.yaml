name: shell_exec
description: "Execute a shell command"
description_en: "Execute a shell command"
version: "1.0.0"
author: "cordbeat"
enabled: false

usage: |
  Execute a shell command directly.
  Use this skill when system operations are required.
  Disabled by default and must be explicitly enabled by the user.

parameters:
  - name: command
    type: string
    required: true
    description: "Command to execute"
  - name: timeout
    type: integer
    required: false
    description: "Timeout in seconds (default: 30)"

contexts:
  shared_voice: false

safety:
  level: dangerous
  sandbox: false
  network: true
  filesystem: true
