name: file_read
description: "Read the contents of a specified file"
description_en: "Read the contents of a specified file"
version: "1.0.0"
author: "cordbeat"

usage: |
  Use this skill to inspect file contents.
  Reading local files requires user approval before execution.

parameters:
  - name: path
    type: string
    required: true
    description: "Path of the file to read"
  - name: max_lines
    type: integer
    required: false
    description: "Maximum number of lines to read (default: 100)"

contexts:
  shared_voice: false

safety:
  level: requires_confirmation
  sandbox: true
  network: false
  filesystem: true
