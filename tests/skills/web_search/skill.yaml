name: web_search
description: "Search the web and return results"
description_en: "Perform a web search and return results"
version: "1.0.0"
author: "cordbeat"

usage: |
  Use this skill to search for information on the web.
  It is useful for checking current information, news, and general knowledge.

parameters:
  - name: query
    type: string
    required: true
    description: "Search query"
  - name: max_results
    type: integer
    required: false
    description: "Maximum number of results to retrieve (default: 5)"

contexts:
  shared_voice: true

safety:
  level: safe
  sandbox: false
  network: true
  filesystem: false
