name: weather
description: "Get weather information for a specified location"
description_en: "Get weather information for a specified location"
version: "1.0.0"
author: "cordbeat"

usage: |
  Use this skill to check a weather forecast.
  Specify a city or region to get current weather and forecast information.

parameters:
  - name: location
    type: string
    required: true
    description: "Location to get weather for (e.g. Tokyo or Yokkaichi)"

contexts:
  shared_voice: true

safety:
  level: requires_confirmation
  sandbox: true
  network: true
  filesystem: false
