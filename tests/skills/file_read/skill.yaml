name: file_read
description: "指定されたファイルの内容を読み込む"
description_en: "Read the contents of a specified file"
version: "1.0.0"
author: "cordbeat"

usage: |
  ファイルの内容を確認したいときに使う。
  ローカルファイルの内容を読むため、実行前にユーザー承認が必要。

parameters:
  - name: path
    type: string
    required: true
    description: "読み込むファイルパス"
  - name: max_lines
    type: integer
    required: false
    description: "読み込む最大行数（デフォルト: 100）"

safety:
  level: requires_confirmation
  sandbox: true
  network: false
  filesystem: true
